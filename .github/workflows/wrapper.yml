name: Gradle wrapper

# One-shot maintenance workflow. It generates the Gradle wrapper at the pinned
# version and commits it, so subsequent builds are reproducible. Run it manually
# from the Actions tab whenever the pinned Gradle version changes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    name: Commit the Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.0

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 9.8.0

      - name: Commit the wrapper
        run: |
          if git status --porcelain -- gradlew gradlew.bat gradle/wrapper | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "Add Gradle wrapper 9.8.0"
            git push
          else
            echo "Gradle wrapper is already up to date"
          fi
